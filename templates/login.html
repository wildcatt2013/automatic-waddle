<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в систему</title>
    <style>
        :root { --bg-color: #f4f7f6; --primary-color: #007bff; --btn-hover: #0056b3; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); width: 100%; max-width: 360px; }
        h2 { margin-top: 0; color: #333; }
        label { font-weight: 600; font-size: 14px; color: #555; display: block; margin-top: 15px; margin-bottom: 5px; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .btn { background: var(--primary-color); color: white; border: none; width: 100%; padding: 12px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 20px; font-size: 15px; }
        .btn:hover { background: var(--btn-hover); }
        .link { display: block; text-align: center; margin-top: 15px; color: var(--primary-color); text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Вход в аккаунт</h2>
        <form method="POST">
            <label>Логин:</label>
            <input type="text" name="username" required>
            
            <label>Пароль:</label>
            <input type="password" name="password" required>
            
            <button type="submit" class="btn">Войти</button>
        </form>
        <a href="/" class="link">На главную</a>
    </div>
</body>
</html>
